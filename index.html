
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoDetectiv - Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <p class="eticheta">MISIUNE DE VERIFICARE</p>
    <h1>InfoDetectiv</h1>
    <p>Devino un detectiv al informațiilor!</p>
  </header>

  <main class="card">
    <div id="scor">⭐ Scor: 0 puncte</div>
    <div id="progres"></div>

    <h2 id="intrebare">Ești gata să verifici știrile?</h2>
    <div id="raspunsuri"></div>
    <p id="mesaj" aria-live="polite"></p>

    <button id="start">START</button>
    <button id="continua" hidden>Următoarea întrebare</button>
  </main>

  <footer>
    <p>Verifică înainte să distribui!</p>
  </footer>
</body>
</html>
